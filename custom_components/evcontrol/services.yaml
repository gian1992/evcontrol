# Action names, descriptions and field labels are not here: Home Assistant reads
# them from strings.json under "services", so that they can be translated. This file
# describes the shape of each action -- its fields, their selectors and whether they
# are required.

set_mode:
  fields:
    mode:
      required: true
      example: "auto"
      selector:
        select:
          options:
            - "eco"
            - "normal"
            - "power"
            - "auto"
            - "auto-eco"

start_charging:

stop_charging:

set_speed:
  fields:
    speed:
      required: true
      example: 16
      selector:
        number:
          min: 6
          max: 32
          step: 1
          unit_of_measurement: "A"
          mode: slider

set_schedule:
  fields:
    day:
      required: true
      example: "weekdays"
      selector:
        select:
          custom_value: true
          multiple: true
          options:
            - "today"
            - "all"
            - "weekdays"
            - "weekend"
            - "monday"
            - "tuesday"
            - "wednesday"
            - "thursday"
            - "friday"
            - "saturday"
            - "sunday"
    time:
      required: true
      example: "07:30"
      selector:
        time:
    soc:
      required: false
      example: 80
      selector:
        number:
          min: 5
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider

set_target_soc:
  fields:
    day:
      required: true
      example: "monday"
      selector:
        select:
          custom_value: true
          multiple: true
          options:
            - "today"
            - "all"
            - "weekdays"
            - "weekend"
            - "monday"
            - "tuesday"
            - "wednesday"
            - "thursday"
            - "friday"
            - "saturday"
            - "sunday"
    soc:
      required: true
      example: 80
      selector:
        number:
          min: 5
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider

unblock_now:

clear_schedule:
  fields:
    day:
      required: true
      example: "saturday"
      selector:
        select:
          custom_value: true
          multiple: true
          options:
            - "today"
            - "all"
            - "weekdays"
            - "weekend"
            - "monday"
            - "tuesday"
            - "wednesday"
            - "thursday"
            - "friday"
            - "saturday"
            - "sunday"

set_start_time:
  fields:
    time:
      required: false
      example: "06:00"
      selector:
        time:
    day:
      required: false
      example: "monday"
      selector:
        text:

set_end_time:
  fields:
    time:
      required: true
      example: "07:30"
      selector:
        time:
    day:
      required: false
      default: "today"
      example: "monday"
      selector:
        text:
